<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Econexión Tec</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Concepto: directorio impreso llevado a pantalla. Índice tipográfico con puntos guía, pestañas de campus al margen, listados en renglones por categoría y subcategoría, marcatextos amarillo como señal de interacción, figuras verdes flotando al fondo. */
:root{
  --paper:#FFFFFF; --paper-2:#EAF6DF; --ink:#0D2416; --soft:#3F5646; --rule:#9CC29F;
  --green:#0E7A3A; --mark:#FFD84A; --on-mark:#0D2416;
  --narrow:'Archivo','Arial Narrow',sans-serif; --text:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.5}
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 24px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance}
.narrow{font-family:var(--narrow);font-stretch:62%;font-weight:800;line-height:.95}
.soft{color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.hl:hover,.hl:focus-visible{background:var(--mark);color:var(--on-mark)}

/* cabecera */
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 24px;padding-block:12px;border-bottom:4px solid var(--green)}
.mast a{text-decoration:none}
.mast .logo{font-family:var(--narrow);font-stretch:62%;font-weight:900;font-size:26px;line-height:1;background:var(--mark);color:var(--on-mark);padding:6px 12px 4px;transform:rotate(-2deg)}
.mast .brand{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.mast .sublogo{font-weight:600;font-size:16px}
.mast nav{display:flex;flex-wrap:wrap;gap:4px 22px}
.mast .link{font-weight:600;padding-block:10px;display:inline-block}

/* inicio */
.intro{padding-block:22px 10px;display:flex;flex-direction:column;gap:10px;max-width:38em}
.intro h1{font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.15}
.index{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
@media (max-width:700px){.index{grid-template-columns:minmax(0,1fr)}}
.index a{display:flex;align-items:baseline;gap:12px;padding-block:4px;text-decoration:none}
.index .nm{font-size:clamp(30px,4.6vw,56px);color:var(--green);padding-inline:.06em;margin-inline:-.06em}
.index a:hover .nm,.index a:focus-visible .nm{background:var(--mark);color:var(--on-mark)}
.dots{flex:1;min-width:20px;border-bottom:3px dotted var(--rule);transform:translateY(-.25em)}
.index .ct{white-space:nowrap;font-weight:600}
.index .online{grid-column:1 / -1;margin-top:8px;padding-top:8px;border-top:4px solid var(--ink)}
.index .online .nm{color:var(--ink)}

/* interior */
.inner{display:grid;grid-template-columns:150px minmax(0,1fr);gap:40px;padding-top:20px}
.tabs{display:flex;flex-direction:column;gap:2px;align-self:start}
.tabs a{font-family:var(--narrow);font-stretch:62%;font-weight:700;font-size:19px;line-height:1.1;text-decoration:none;padding:7px 10px;min-height:34px;border-left:4px solid var(--rule)}
.tabs a:hover{background:var(--paper-2)}
.tabs a[aria-current="page"]{background:var(--mark);color:var(--on-mark);border-left-color:var(--ink)}
.tabs .sep{margin-top:10px}
@media (max-width:760px){
  .inner{grid-template-columns:minmax(0,1fr);gap:24px}
  .tabs{flex-direction:row;flex-wrap:wrap;gap:4px}
  .tabs a{border-left:0;border-bottom:4px solid var(--rule);font-size:19px}
  .tabs a[aria-current="page"]{border-bottom-color:var(--ink)}
  .tabs .sep{margin-top:0}
}
.content{display:flex;flex-direction:column;gap:20px;min-width:0}
.solo{padding-top:28px}
.title{font-size:clamp(38px,6vw,68px);color:var(--green)}
.title.mid{font-size:clamp(30px,4.4vw,50px)}
.headrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
.find{display:flex;flex-direction:column;gap:4px;flex:0 1 320px;min-width:220px}
.find label{font-size:15px;font-weight:600}
.find input{font:inherit;color:var(--ink);background:var(--paper);border:0;border-bottom:3px solid var(--ink);padding:8px 2px;min-height:44px;width:100%;border-radius:0}
.find input::placeholder{color:var(--soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{background:var(--paper);border:2px solid var(--ink);padding:8px 14px;min-height:44px;font-weight:600}
.filters button:hover{background:var(--paper-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* listado */
.cat{display:flex;flex-direction:column;gap:14px}
.cat > h2{font-size:30px;padding-bottom:6px;border-bottom:4px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cat > h2 span{font-family:var(--text);font-stretch:100%;font-size:16px;font-weight:600}
.sub h3{font-size:17px;font-weight:700;color:var(--green);padding-top:6px}
.entry{display:block;padding:12px 6px;margin-inline:-6px;text-decoration:none;border-bottom:1px solid var(--rule);background:rgba(255,255,255,.82)}
.entry:hover,.entry:focus-visible{background:var(--mark);color:var(--on-mark)}
.entry:hover .soft{color:var(--on-mark)}
.entry strong{font-size:20px;font-weight:700;line-height:1.25;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:14px;font-weight:600;line-height:1.3;padding:3px 9px;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);text-decoration:none}
a.tag:hover{background:var(--mark);border-color:var(--ink)}
.none{padding:20px 0;font-size:19px;max-width:34em}

/* ficha */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;font-weight:600}
.crumbs a{padding-block:8px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.block{display:flex;flex-direction:column;gap:12px}
.block h2{font-size:30px;padding-bottom:6px;border-bottom:4px solid var(--ink)}
.block p{max-width:36em;background:rgba(255,255,255,.82)}
.aside{background:var(--paper-2);padding:20px}
.facts div{padding:10px 0;border-bottom:1px solid var(--rule)}
.facts dt{font-weight:600;font-size:15px;color:var(--soft)}
.contact li{padding:8px 0;border-bottom:1px solid var(--rule);overflow-wrap:anywhere;user-select:all}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:8px}
.pager a{font-weight:700;padding:10px 0;text-underline-offset:4px}

/* criterios */
.krow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(60px,1fr) 2.5em;gap:12px;align-items:center;padding:9px 6px;margin-inline:-6px;text-decoration:none;border-bottom:1px solid var(--rule);background:rgba(255,255,255,.82)}
.krow:hover,.krow:focus-visible{background:var(--mark);color:var(--on-mark)}
.krow b{font-weight:600}
.krow .bar{height:14px;background:var(--green)}
.krow .n{text-align:right;font-weight:700}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);font-size:15px}
/* ===== Ajuste compacto: el inicio cabe en una sola pantalla en teléfono y en PC ===== */
body{font-size:16px;line-height:1.45}
.page{padding-inline:16px;padding-block:0 12px}
.mast{padding-block:8px;gap:2px 20px}
.mast .logo{font-size:22px}
.mast .sublogo{font-size:14px}
.mast .link{padding-block:4px;font-size:15px}
.intro{padding-block:1.6vh 1vh;gap:2px;max-width:44em}
.intro h1{font-size:clamp(18px,2.4vw,24px)}
.intro p{font-size:15px}
.index a{padding-block:.35vh;gap:10px}
.index .nm{font-size:min(8.5vw,4.7vh,40px)}
.index .ct{font-size:14px}
.index .online{margin-top:.6vh;padding-top:.6vh;border-top-width:3px}
.index .online p{display:none}
@media (min-width:701px){.index .nm{font-size:min(4.2vw,7.2vh,56px)}}
.inner{gap:28px;padding-top:14px}
.content{gap:16px}
.solo{padding-top:14px}
.title{font-size:clamp(32px,5.4vw,56px)}
.title.mid{font-size:clamp(26px,4vw,44px)}
.filters{gap:6px}
.filters button{padding:4px 10px;min-height:36px;font-size:15px}
.find input{min-height:38px;padding-block:5px}
.cat{gap:8px}
.cat > h2{font-size:26px}
.sub h3{font-size:15px}
.entry{padding:8px 6px}
.entry strong{font-size:17px}
.tags{gap:5px;margin-top:5px}
.tag{font-size:13px}
.cols{gap:28px}
.block h2{font-size:22px}
.aside{padding:14px}
.foot{margin-top:1.2vh;padding-top:6px;font-size:12px}
@media (max-width:760px){
  .inner{gap:12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;gap:2px;padding-bottom:2px}
  .tabs a{font-size:16px;padding:6px 9px;white-space:nowrap;border-bottom-width:3px}
}
</style>
</head>

rabajadoras, promoviendo la igualdad de género y la educación para la paz, para que crezcan sanos, felices, creativos y capaces de desarrollar sus habilidades tanto en la escuela como en casa, aprovechando al máximo los recursos disponibles.","pq":"Impulsar el desarrollo materno infantil mediante técnicas y dinámicas psicopedagógicas para lactantes y preescolares, actividades educativas en general tanto para padres como para hijos.","ct":["betinaxx@yahoo.com","871 7324522"]},{"c":"lag","n":"EDUSER Reforma primaria","cat":"Salud y bienestar","sub":["Social"],"cr":["Apoyo educacional","Educación y formación educacional"],"of":"Brindar educación y alimentación gratuita a niños de escasos recursos contribuyendo así a la formación de individuos felices y buenos ciudadanos.","pq":"Impulsar el desarrollo integral del alumno, brindamos las herramientas necesarias para fortalecer sus habilidades intelectuales promoviendo el desarrollo del carácter y fomentando valores en un ambiente de amor, respeto y confianza con el fin de que se conozcan a sí mismos y adquieran el compromiso de convertirse en agentes de cambio.","ct":["smartinez@frater.org.mx","871-748-10-37"]},{"c":"pue","n":"AGUA DE PUEBLA PARA TODOS","cat":"Académica","sub":["Papelería"],"cr":["Eficiencia en el uso del agua","Energías limpias","Tratamiento de aguas residuales","Reducción de emisiones","Prácticas éticas"],"of":"Agua de Puebla para Todos ofrece servicios de suministro de agua potable, drenaje, alcantarillado y saneamiento en la ciudad de Puebla y municipios cercanos. Opera plantas de tratamiento y potabilización para mejorar la calidad del agua, implementa programas de cultura del agua para fomentar su uso responsable y promueve iniciativas de sustentabilidad, como la transición a energías limpias.","pq":"Agua de Puebla para Todos es una empresa comprometida con la sustentabilidad y la responsabilidad social. Destaca por su gestión eficiente del agua, el uso de energías limpias, programas de cultura hídrica y la operación de plantas de tratamiento, recibiendo el Distintivo ESR del CEMEFI por sus prácticas éticas y ambientales.","ct":[]},{"c":"pue","n":"KALUNA Sustainable apparel","cat":"Personal","sub":["Ropa"],"cr":["Gestión de emisiones","Economía circular","Producción ética"],"of":"En Kaluna creamos ropa y accesorios increíbles desarrollados a partir de materiales reciclados. Hemos encontrado la solución que nos permite estar a la moda y al mismo tiempo colaborar con nuestro planet","pq":"Marca de ropa que emplea textiles ecológicamente amigables en el 100% de sus prendas y promueve un comercio justo que busca salvaguardar integridad del planeta y de sus habitantes.","ct":["info@kaluna.com.mx","https://kalunamx.wordpress.com/"]},{"c":"pue","n":"Blumkloss","cat":"Personal","sub":["Ropa"],"cr":["Comercio justo","Consumo responsable","Empleo","Reutilizar","Segunda mano"],"of":"Blumkloss compra ropa usada y vintage con potencial de reventa o transformación. Las prendas seleccionadas se comercializan en tienda física y/o en línea, otorgando a las vendedoras un 35% del valor final. Aquellas piezas con posibilidades de rediseño son trabajadas por costureras locales, generando empleo digno. La tienda busca formalizar el modelo a través de alianzas en todo el país, promoviendo el consumo consciente, el comercio justo y la moda sostenible.","pq":"Blumkloss es una tienda que compra ropa usada o vintage en buen estado, ofreciendo a las vendedoras un 35% de ganancia sobre el precio final. Impulsa la economía local al emplear costureras para transformar prendas y promueve el consumo responsable a través de la reutilización","ct":["zcsolad@gmail.com"]},{"c":"pue","n":"JARDÍN BOTANICO UNIVERSITARIO BUAP","cat":"Recreación","sub":["Actividades al aire libre"],"cr":["Conservación","Educación ambiental","Sostenibilidad","Restauración ecológica","Eficiencia energética"],"of":"El Jardín Botánico Universitario de la BUAP ofrece una variedad de servicios educativos y de conservación. Organiza talleres y cursos sobre botánica, ecología y herbolaria, promoviendo la educación ambiental. Además, brinda oportunidades para realizar prácticas profesionales y servicio social en el área de investigación sobre flora local, biotecnología vegetal y restauración ecológica.","pq":"El Jardín Botánico Universitario de la BUAP es un espacio dedicado a la conservación de la biodiversidad, la educación ambiental y la investigación científica. Ofrece actividades educativas y prácticas de conservación, y es un centro de estudio sobre flora local, plantas medicinales y sostenibilidad en Puebla.","ct":["jardin.botanico@correo.buap.mx"]},{"c":"pue","n":"Jardín Etnobotánico Francisco Peláez R.","cat":"Recreación","sub":["Actividades al aire libre"],"cr":["Conservación de biodiversidad","Educación ambiental","Reforestación","Uso responsable de recursos","Protección de especies endémicas","Investigación","Restauración ecológica.}"],"of":"El Jardín Etnobotánico ofrece una variedad de servicios educativos y culturales centrados en la relación entre las plantas y las culturas humanas. Entre sus actividades destacan talleres prácticos como la elaboración de herbarios, jardinería en macetas, aromaterapia, arte con flores prensadas, manejo de residuos, y creación de terrarios. Además, organiza recorridos guiados, caminatas botánicas, conferencias y actividades familiares.","pq":"El Jardín Etnobotánico Francisco Peláez R. en San Andrés Cholula, Puebla, es un espacio dedicado a la conservación de la biodiversidad local. Ofrece actividades educativas, visitas guiadas y talleres sobre el uso tradicional de plantas nativas, promoviendo la conciencia ambiental y el respeto por los ecosistemas.","ct":["paulina.jardinet@gmail.com"]},{"c":"pue","n":"PARQUE FLOR DEL BOSQUE","cat":"Recreación","sub":["Actividades al aire libre"],"cr":["Conservación de biodiversidad","Ecoturismo responsable","Educación ambiental","Gestión de residuos","Protección de flora y fauna"],"of":"El Parque Estatal Flor del Bosque ofrece una variedad de servicios enfocados en la recreación, la educación ambiental y la conservación. Los visitantes pueden disfrutar de actividades como ciclismo de montaña, rappel, tirolesa, y gotcha, así como espacios de esparcimiento como áreas verdes, zonas de lectura y cafeterías. También cuenta con senderos interpretativos y talleres educativos para sensibilizar sobre la importancia de la conservación del medio ambiente.","pq":"Área natural protegida de 664 hectáreas en Amozoc, Puebla, que ofrece actividades recreativas, educativas y de conservación ambiental, promoviendo la biodiversidad y el ecoturismo.","ct":["contacto@flordelbosque.puebla.gob.mx"]},{"c":"pue","n":"TecFood2Go","cat":"Recreación","sub":["Comida en restaurantes"],"cr":["Reducción de residuos","Uso de recursos retornables","Eficiencia energética","Reducción de huella de carbono","Consumo responsable","Economía circular","Reutilización de materiales","Responsabilidad ambiental"],"of":"TecFood2Go ofrece un servicio de contenedores retornables para alimentos en las cafeterías del Tecnológico de Monterrey. Los usuarios adquieren un token por un depósito reembolsable, el cual pueden intercambiar por un contenedor limpio y desinfectado en la barra. Después de usar el contenedor, lo devuelven en una máquina TecFood2Go para recibir su token de vuelta.","pq":"TecFood2Go es una iniciativa sostenible del Tecnológico de Monterrey que promueve el uso de contenedores retornables en sus cafeterías para reducir el consumo de plásticos desechables. Los estudiantes pueden utilizar tokens para obtener y devolver los contenedores, contribuyendo a la reducción de residuos y promoviendo hábitos responsables de consumo.","ct":["ceddie.pue@servicios.itesm.mx"]},{"c":"pue","n":"EL CAMINO HACIA ESCUELAS SUSTENATABLES","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Educación ambiental","Gestión de residuos","Compostaje","Reforestación","Uso responsable del agua"],"of":"La iniciativa ofrece programas y actividades educativas enfocadas en la sostenibilidad dentro de escuelas públicas del municipio de Puebla. A través de servicios como talleres, campañas ambientales, y acciones prácticas como compostaje, reforestación, separación de residuos y cuidado del agua, busca formar ciudadanos conscientes del medio ambiente.","pq":"El Gobierno Municipal de Puebla es la institución encargada de administrar los servicios públicos y promover el desarrollo sustentable en la ciudad. A través de distintas secretarías, impulsa programas educativos, ambientales y sociales para mejorar la calidad de vida de la ciudadanía.","ct":["secretaria.educacion.ocs@seppue.gob.mx"]},{"c":"pue","n":"SADRO RESIDENCIAS","cat":"Salud y bienestar","sub":["Mobiliario para vivienda"],"cr":["Eficiencia energética","Materiales ecológicos","Energías renovables","Reducción de CO₂","Construcción verde"],"of":"SADRO Residencias ofrece viviendas sustentables que cumplen con altos estándares de eficiencia energética y diseño responsable. Sus proyectos están certificados con LEED (Leadership in Energy and Environmental Design), lo que garantiza un bajo impacto ambiental. La constructora se enfoca en crear comunidades residenciales integradas, con tecnologías limpias, ahorro de recursos naturales, y soluciones de energía renovable.","pq":"SADRO Residencias es una constructora inmobiliaria en Puebla, pionera en viviendas sustentables con certificación LEED®. Su enfoque está en el diseño eficiente, el uso de energías renovables y la construcción responsable, ofreciendo soluciones habitacionales que contribuyen a un desarrollo urbano más sostenible y de bajo impacto ambiental.","ct":["contacto@sadroresidencias.com"]},{"c":"pue","n":"Universidad IBERO: Campus Sustentable y Basura Cero","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Reducción de residuos","Reciclaje","Reutilización","Compostaje","Eficiencia energética","Uso responsable del agua","Reducción de huella de carbono","Sensibilización ambiental","Consumo responsable","Movilidad sostenible"],"of":"La Universidad Iberoamericana Puebla ha implementado el programa Basura Cero como parte de su compromiso con la sustentabilidad. Esta iniciativa busca reducir la generación de residuos y promover su manejo adecuado a través de la separación, reutilización y reciclaje. Se han instalado estaciones de separación de residuos en todo el campus, donde se clasifican materiales reciclables, orgánicos y no reciclables.","pq":"La Universidad Iberoamericana Puebla (IBERO Puebla) es una institución privada de educación superior confiada a la Compañía de Jesús, ubicada en San Andrés Cholula, Puebla, México. Fundada en 1983, forma parte del Sistema Universitario Jesuita y se distingue por su excelencia académica, compromiso social y enfoque humanista","ct":["guillermina.lopez@iberopuebla.mx"]},{"c":"pue","n":"RECICLATRÓN 2025","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Reciclaje","Economía circular","Reducción de residuos","Educación ambiental","Reutilización"],"of":"El Reciclatón 2025 en Puebla es una iniciativa organizada por el gobierno estatal en colaboración con instituciones académicas y organizaciones civiles. Su objetivo es promover la cultura del reciclaje y la gestión responsable de residuos. Durante el evento, se reciben diversos materiales reciclables, incluyendo papel, cartón, plásticos, metales, vidrio, electrónicos y electrodomésticos en desuso.","pq":"El Reciclatón 2025 en Puebla es una iniciativa organizada por el gobierno estatal y otras instituciones para promover el reciclaje y la gestión adecuada de residuos. A través de eventos y actividades, busca incentivar a la comunidad a participar activamente en la protección del medio ambiente y la economía circular.","ct":["medioambiente@puebla.gob.mx"]},{"c":"pue","n":"ZONTE ALIMENTOS","cat":"Salud y bienestar","sub":["Alimentos para preparar en casa"],"cr":["Producción orgánica","Uso responsable de recursos","Comercio justo","Conservación de la biodiversidad"],"of":"Zontle Alimentos ofrece una variedad de condimentos 100% naturales, ideales para realzar el sabor de tus platillos. Entre sus productos destacan el orégano, la hoja de aguacate, la hoja santa, la sal artesanal y sazonadores tradicionales. Estos ingredientes son cultivados y procesados en la región de la Mixteca poblana, respetando prácticas sostenibles y preservando las tradiciones culinarias locales.","pq":"Zontle Alimentos es una cooperativa ubicada en San Martín del Valle, Puebla, dedicada a la producción de condimentos naturales como orégano, hoja de aguacate, hoja santa, sal artesanal y sazonadores. Su enfoque en la calidad y sostenibilidad les ha permitido exportar a países como Estados Unidos, Japón, Italia y Dubái. Además, han obtenido certificaciones como Kosher y cumplen con normativas sanitarias mexicanas.","ct":["proescamzontle@gmail.com"]},{"c":"pue","n":"Pure Water Technology","cat":"Salud y bienestar","sub":["Productos de higiene personal"],"cr":["Reducción de plásticos","Acceso sostenible al agua","Consumo responsable","Disminución de huella de carbono","Eficiencia en el uso de recursos"],"of":"Los bebederos de Agua Óptima en el Tec Campus Puebla son dispensadores de agua purificada que ofrecen una alternativa sustentable al uso de botellas plásticas. Estos sistemas garantizan agua libre de virus y bacterias, promoviendo el consumo responsable y reduciendo residuos. Son de fácil acceso para la comunidad estudiantil y contribuyen a la sustentabilidad del campus.","pq":"Pure Water Technology (Agua Óptima) es una empresa mexicana que ofrece soluciones de purificación de agua, eliminando virus y bacterias sin generar residuos plásticos. Con más de 10 años de experiencia y 50,000 servicios, promueve el acceso sostenible al agua a través de dispensadores innovadores en hogares, empresas e instituciones.","ct":["ventas@purewater.mx"]},{"c":"pue","n":"TecFood2Go","cat":"Salud y b y ambientales.","ct":["atencion.clientes@aguapuebla.mx"]},{"c":"pue","n":"Iberdrola México","cat":"Salud y bienestar","sub":["Productos de atención médica"],"cr":["Eficiencia energética","Energías renovables","Reducción de emisiones","Desarrollo comunitario","Conservación del agua"],"of":"Iberdrola México ofrece en Puebla soluciones energéticas sostenibles, operando dos parques eólicos y una planta fotovoltaica con una capacidad instalada de 561 MW. Además, desarrolla iniciativas sociales como \"Luces de Esperanza\", que ha llevado electricidad mediante paneles solares a más de 1,800 personas en comunidades rurales, y proyectos de suministro de agua potable que benefician a 3,000 habitantes locales.","pq":"Iberdrola México es una empresa líder en generación y comercialización de energía eléctrica, comprometida con el desarrollo sostenible. Opera proyectos de energía renovable y convencional, promoviendo la transición energética, la innovación y el bienestar social en comunidades como Puebla. Forma parte del Grupo Iberdrola, con presencia global.","ct":["mx.recursoshumanos@iberdrola.com"]},{"c":"pue","n":"Green Chile: Reuso en el TEC","cat":"Salud y bienestar","sub":["Productos de atención médica"],"cr":["Reducción de residuos","Reutilización de materiales","Consumo responsable","Eficiencia de recursos","Compromiso ambiental"],"of":"Green Chile ofrece comida mexicana preparada con ingredientes frescos y naturales, sin conservadores ni sabores artificiales. Como parte de su compromiso con la sustentabilidad, ha implementado el uso de platos y vasos reutilizables en su sucursal del Tec de Monterrey. Estos utensilios no son desechables; los comensales los dejan en estaciones designadas dentro del campus, desde donde son recolectados por el personal del restaurante para ser lavados y reutilizados.","pq":"Green Chile es un restaurante comprometido con la sustentabilidad, que promueve el consumo responsable mediante el uso de ingredientes frescos y empaques biodegradables. Implementa prácticas ecológicas como el reciclaje y la eficiencia energética, buscando reducir su impacto ambiental y fomentar una cultura más consciente dentro y fuera del campus.","ct":["contacto@greenchile.com.mx"]},{"c":"pue","n":"Vesta Park Puebla I","cat":"Salud y bienestar","sub":["Mobiliario para vivienda"],"cr":["Eficiencia energética","Uso de energías renovables","Reciclaje de agua","Gestión de residuos","Materiales ecoeficientes","Certificación LEED","Reducción de huella de carbono","Tecnologías limpias"],"of":"Vesta Park Puebla I ofrece espacios industriales de vanguardia para el desarrollo, operación y arrendamiento de naves industriales y centros de distribución. El parque brinda a las empresas acceso a infraestructura moderna y eficiente, diseñada con altos estándares de sustentabilidad con un enfoque en eficiencia energética y reducción del impacto ambiental.","pq":"Vesta Park Puebla I es un parque industrial situado a solo 2 km del Aeropuerto Internacional de Puebla, en Huejotzingo. Somos una empresa mexicana dedicada al desarrollo, gestión y arrendamiento de naves industriales y centros de distribución en México. Nuestro objetivo es proporcionar a nuestros clientes ubicaciones estratégicas de clase mundial en 14 estados, ofreciendo instalaciones modernas construidas bajo estándares de eficiencia ecológica.","ct":["info@vesta.com.mx"]},{"c":"pue","n":"Sociedad Cooperativa Tosepan Titataniske","cat":"Salud y bienestar","sub":["Alimentos para preparar en casa"],"cr":["Agricultura orgánica","Comercio justo","Conservación de biodiversidad","Empoderamiento comunitario","Reforestación","Turismo responsable"],"of":"La Sociedad Cooperativa Tosepan Titataniske ofrece productos orgánicos como café, pimienta y miel, cultivados bajo prácticas sostenibles y respetuosas con el medio ambiente. Además, brinda servicios de ecoturismo, incluyendo alojamiento en comunidades indígenas y actividades como caminatas guiadas y talleres culturales. También gestionan cooperativas de ahorro y crédito, apoyando el desarrollo económico local.","pq":"La Sociedad Cooperativa Tosepan Titataniske es una organización indígena que promueve la economía solidaria y la sustentabilidad en la Sierra Norte de Puebla. A través de la agricultura orgánica, el ecoturismo y el fortalecimiento comunitario, impulsa el desarrollo social, económico y ambiental, preservando tradiciones y recursos naturales.","ct":["info@tosepan.com"]},{"c":"pue","n":"Planta de Agua Santa María","cat":"Salud y bienestar","sub":["Productos de higiene personal"],"cr":["Agua responsable","Energía renovable","Certificación AWS","Huella reducida","Reforestación","PET reciclado","Filtración natural","Protección de manantiales","Educación ambiental","Limpieza de ríos"],"of":"Agua Sta. María ofrece agua de manantial premium, naturalmente filtrada por rocas volcánicas durante más de una década, lo que le da una composición mineral única. Sus productos están disponibles en diversas presentaciones y tamaños, ideales para consumo diario o eventos. Además de agua embotellada, promueven prácticas sostenibles como el uso de botellas reciclables, energía renovable en su producción y campañas de concientización ambiental.","pq":"Agua Sta. María es una marca mexicana de Nestlé Waters que ofrece agua 100% pura de manantial, filtrada naturalmente por rocas volcánicas durante 12 años. Su planta en Puebla destaca por su compromiso con la sostenibilidad, el uso de energía renovable y la protección del medio ambiente y las comunidades locales.","ct":["csv.mexico@mx.nestle.com"]},{"c":"pue","n":"Banco de Tapitas","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Reciclaje de plástico","Economía circular","Apoyo a la salud infantil","Responsabilidad social","Educación ambiental","Reducción de residuos","Participación comunitario"],"of":"Banco de Tapitas A.C. brinda apoyo integral a niñas y niños con cáncer, incluyendo leucemia, mediante la recolección de tapitas de plástico. Con los recursos generados, ofrece tratamientos médicos, medicamentos, estudios, prótesis, transporte y hospedaje en albergues. Su misión es mejorar la calidad de vida de pacientes pediátricos en situación vulnerable.","pq":"Banco de Tapitas A.C. es una organización sin fines de lucro que recolecta tapitas de plástico para financiar tratamientos médicos de niñas y niños con cáncer, promoviendo al mismo tiempo el reciclaje, la conciencia ambiental y la participación social en toda la comunidad.","ct":["asistencia@bancodetapitas.org"]},{"c":"pue","n":"BASF Puebla; PNAA","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Eficiencia energética","Reducción de emisiones","Gestión de residuos","Uso responsable de recursos","Conservación de la biodiversidad"],"of":"BASF Puebla se dedica a la producción de productos químicos de especialidad utilizados en diversas industrias como la automotriz, minera y aeroespacial. A través del Programa Nacional de Auditoría Ambiental (PNAA), la planta ha implementado prácticas sostenibles que le permitieron obtener la Certificación de Industria Limpia, otorgada por la PROFEPA. Esto incluye la optimización de recursos, la reducción de residuos y la mejora de procesos para minimizar el impacto ambiental. BASF también se enfoca en la innovación y la colaboración con autoridades para promover una producción responsable y sustentable en sus operaciones.","pq":"BASF Puebla es una planta de BASF Mexicana ubicada en Heroica Puebla de Zaragoza. Desde 1965, produce químicos de alto desempeño para las industrias minera, aeronáutica y automotriz. Destaca por su compromiso con la sostenibilidad y la seguridad industrial .","ct":["contacto@basf.com"]},{"c":"pue","n":"Ternium: Inversión en Tecnología Ambiental","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Reducción de emisiones","Eficiencia energética","Control de residuos","Tecnologías limpias","Responsabilidad social","Economía circular","Manejo de recursos","Cumplimiento normativo","Innovación ambiental"],"of":"Ternium México ha invertido 28.5 millones de dólares en un sistema avanzado de aspiración de humos y polvos, con el objetivo de mejorar la sustentabilidad en sus operaciones industriales. Esta tecnología ayuda a reducir la emisión de contaminantes en la atmósfera, contribuyendo a una producción más limpia. La inversión forma parte de un plan integral para mejorar el desempeño ambiental de sus unidades en todo México. A través de esta iniciativa, Ternium reafirma su compromiso con la comunidad, el medio ambiente y su liderazgo en el uso de tecnologías limpias y eficientes en la industria del acero.","pq":"Ternium México es una empresa líder en la producción de acero en América Latina. Con plantas en diversas ubicaciones, incluida Puebla, se enfoca en la innovación, la sostenibilidad y el compromiso con la comunidad, implementando tecnologías avanzadas para reducir su impacto ambiental y mejorar la eficiencia de sus procesos industriales.","ct":["jseade@ternium.com"]},{"c":"pue","n":"Grupo IFISA: Descarbonización y Certificación RECS","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Descarbonización","Eficiencia energética","Reducción de emisiones","Uso de biomasa","Reciclaje","Certificación de carbono"],"of":"Grupo IFISA ha implementado un sistema de descarbonización a través de la reducción del 97.9% en la intensidad de sus emisiones de CO₂e. La empresa utiliza tecnologías de biomasa para la fabricación de estufas eficientes, promueve el reciclaje de materiales y ha obtenido la certificación RECS (I-REC) para validar sus esfuerzos en la reducción de emisiones. Estas iniciativas forman parte de su compromiso con la sustentabilidad, mejorando la eficiencia energética y contribuyendo al bienestar ambiental, lo que permite a Grupo IFISA operar de manera más responsable y alineada con los objetivos globales de reducción de carbono.","pq":"Grupo IFISA es una empresa mexicana dedicada a la fabricación de soluciones industriales sostenibles. Se especializa en la producción de empaques y embalajes, con un fuerte compromiso con la sostenibilidad, implementando tecnologías innovadoras como la biomasa y la certificación de emisiones de carbono, contribuyendo al cuidado del medio ambiente.","ct":["ventas@ifisa.com.mx"]},{"c":"pue","n":"Ayuntamiento de Puebla: Reportar un bache con Ángela","cat":"Transporte","sub":["Automóvil"],"cr":["Eficiencia energética","Reducción de emisiones","Gestión responsable de recursos","Uso de tecnología verde","Accesibilidad","Transparencia","Participación ciudadana","Fomento al reciclaje","Educación ambiental","Mejora de infraestructura urbana"],"of":"La iniciativa Ángela, desarrollada por el Ayuntamiento de Puebla, ofreció una plataforma digital para facilitar la interacción entre la ciudadanía y el gobierno municipal. A través de esta herramienta, los usuarios podían realizar reportes de baches, luminarias descompuestas, poda de árboles y otros servicios públicos. Además, proporcionaba información sobre trámites como licencias, expediente digital y alineamiento, así como detalles sobre programas municipales.","pq":"El Ayuntamiento de Puebla es el gobierno municipal de la ciudad de Puebla, encargado de la administración pública local. Su misión es mejorar la calidad de vida de los ciudadanos a través de servicios públicos, infraestructura, seguridad, y desarrollo urbano, promoviendo la participación ciudadana y la transparencia.","ct":["denunciaciudadana@puebla.gob.mx"]},{"c":"qro","n":"KALUNA Sustainable apparel","cat":"Personal","sub":["Ropa"],"cr":["Gestión de emisiones","Economía circular","Producción ética"],"of":"En Kaluna creamos ropa y accesorios increíbles desarrollados a partir de materiales reciclados. Hemos encontrado la solución que nos permite estar a la moda y al mismo tiempo colaborar con nuestro planet","pq":"Marca de ropa que emplea textiles ecológicamente amigables en el 100% de sus prendas y promueve un comercio justo que busca salvaguardar integridad del planeta y de sus habitantes.","ct":["info@kaluna.com.mx","https://kalunamx.wordpress.com/"]},{"c":"qro","n":"ERRRANTE","cat":"Recreación","sub":["Actividades en salón cerrado"],"cr":["Bioclimática","Confort","Eficiencia","Sustentabilidad"],"of":"Errrante tiene un enfoque abierto a cualquier escala de intervención, desarrollando propuestas que van desde diseño itinerante, interiorismo, arquitectura residencial, comercial y urbanismo.","pq":"Establecido en MMXXI (2021), Errrante nace como un equipo virtual colaborativo, resultado de la unión de diferentes perspectivas que convergen en una ideología bioclimática y sostenible.","ct":["hello@errante.com"]},{"c":"qro","n":"AliBio","cat":"Salud y bienestar","sub":["Productos de atención médica"],"cr":["Agricultura sostenible","Biotecnología","Sustentabilidad"],"of":"Desarrollan potenciadores biológicos para plantas, compuestos por nuestros consorcios microbianos de más de cepas y cofactores, que reducen el uso de agroquímicos al optimizar las condiciones para un mejor crecimiento, nutrición y salud del cultivo que genere valor al productor.","pq":"AliBio desarrolla y comercializa soluciones biotecnológicas sustentables para la industria agrícola.","ct":["contacto@alibio.com.mx"]},{"c":"qro","n":"RECSA","cat":"Salud y bienestar","sub":["Productos de limpieza del hogar"],"cr":["Consumo responsable","Desarrollo comunitario y sustentabilidad"],"of":"Se dedican a la recolección y compra de residuos industriales y recolección de residuos sólidos, además de ser proveedores directos de transformadoras como acereras, papeleras, fundidoras, fabricantes de aleaciones metálicas y transformadoras de plásticos para la industria en general con el mismo modelo de negocios.","pq":"Empresa con más de 25 años de experiencia, en la recolección de residuos, se especializan en ofrecer al cliente soluciones para el manejo de sus residuos .","ct":["contacto@recsabajio.com"]},{"c":"qro","n":"Tierra de Monte","cat":"Salud y bienestar","sub":["Productos de atención médica"],"cr":["Agricultura orgánica","Capacitación","Desarrollo comunitario","Salud y sustentabilidad"],"of":"A través de la plataforma BioAgTech, Tierra de Monte crea soluciones microbiológicas para mejorar la biodiversidad del suelo y de las plantas, y para controlar enfermedades y plagas al fortalecer los mecanismos de defensa naturales. Su enfoque de largo plazo busca mantener un constante equilibrio entre el impacto productivo, social y ambiental.","pq":"Empresa mexicana con proyección internacional que trabaja para restablecer el equilibrio así como en la red de biodiversidad en el suelo y los ecosistemas agrícolas.","ct":["contacto@tierrademonte.co"]},{"c":"sfe","n":"KALUNA Sustainable apparel","cat":"Personal","sub":["Ropa"],"cr":["Gestión de emisiones","Economía circular","Producción ética"],"of":"En Kaluna creamos ropa y accesorios increíbles desarrollados a partir de materiales reciclados. Hemos encontrado la solución que nos permite estar a la moda y al mismo tiempo colaborar con nuestro planet","pq":"Marca de ropa que emplea textiles ecológicamente amigables en el 100% de sus prendas y promueve un comercio justo que busca salvaguardar integridad del planeta y de sus habitantes.","ct":["info@kaluna.com.mx","https://kalunamx.wordpress.com/"]},{"c":"sfe","n":"Carla Fernández","cat":"Personal","sub":["Ropa"],"cr":["Producción responsable","Impacto en la comunidad"],"of":"La marca ofrece una variedad de productos que incluyen prendas de vestir como túnicas, capas, faldas, shorts, sacos y vestidos, así como accesorios como bolsas y pulseras.","pq":"Carla Fernández es una reconocida diseñadora mexicana que lidera una marca de moda ética y sustentable con sede en la Ciudad de México. Su empresa colabora estrechamente con más de 175 artesanas y artesanos de 12 estados del país, preservando y reinterpretando técnicas textiles tradicionales en prendas contemporáneas","ct":["info@carlafernandez.com","55 5264 2226","https://www.carlafernandez.com/"]},{"c":"sfe","n":"Selvaggi Swimwear","cat":"Personal","sub":["Ropa"],"cr":["Nylon regenerado","Reciclaje","Donación para el cuidado de oceanos","Ecológico"],"of":"Trajes de baño para hombre y mujer.","pq":"Selvaggi Swimwear es una empresa mexicana que ofrece trajes de baño sustentables de hombre y mujer mediante compra en linea. Utilizan una fibra llamada ECONYL que es Nylon regenerado y vienen de redes de pescar fantasma recolectada de los oceanos. Además, por cada compra se hae una donación de 1USD a Healthy Seas para seguir ayudando a los oceanos.","ct":["info@selvaggiswimwear.com","https://www.selvaggiswimwear.com/"]},{"c":"sfe","n":"Someone Somewhere","cat":"Personal","sub":["Ropa"],"cr":["Comunidades indígenas","Diseños contemporáneos"],"of":"Sudaderas, chamarras, playeras, mochilas, bolsas y gorras.","pq":"Someone Somewhere es una empresa mexicana de moda que combina el diseño contemporáneo y artesanal de las comunidades indígenas. Ofrecen productos de impacto social y ambiental positivo de alta calidad.","ct":["ayuda@someonesomewhere.mx","55 6509 9426","https://someonesomewhere.mx/"]},{"c":"sfe","n":"Básicos de México","cat":"Personal","sub":["Ropa"],"cr":["Reciclaje"],"of":"Camisetas, sudaderas, pantalones, vestidos y ropa interior. También cuentan con accesorios como tote bags y gorras","pq":"Marca de ropa mexicana que se distingue por su enfoque sustentable y minimalista. Su compromiso con el medio ambiente se refleja en el uso de materiales orgánicos y reciclados, como el algodón orgánico y fibras regeneradas, así como en la implementación de procesos de producción responsables que minimizan el consumo de agua y energía. Además, la marca promueve la producción local y ética, trabajando con talleres mexicanos que garantizan condiciones laborales justas.","ct":["hola@bscs.mx","https://bscs.mx/"]},{"c":"sfe","n":"CIHUAH store","cat":"Personal","sub":["Accesorios de vestir"],"cr":["Uso responsable de agua","Innovación sostenible","Impacto en la comunidad"],"of":"Ropa y accesorios para mujer y hombre. Playeras, pantalones, vestidos, fadas, shorts, sacos, blazers, bolsas y joyería.","pq":"CIHUAH utiliza materiales responsables como textiles reciclados y deadstock, evitando el uso de pieles animales. Implementa procesos de producción que minimizan el desperdicio, como patrones que reducen residuos y técnicas de impresión digital que ahorran agua. Además, trabaja con artesanos locales y emplea empaques reciclados y compostables, promoviendo una producción ética y de bajo impacto ambiental","ct":["WA: +52 55 7427 5622","info@cihuah.com","https://cihuah.com/"]},{"c":"sfe","n":"BUNA","cat":"Salud y bienestar","sub":["Alimentos para preparar en casa"],"cr":["Producción responsable","Impacto en la comunidad"],"of":"Ofrece café, chocolate, miel y productos con hongos.","pq":"Buna es una empresa mexicana comprometida con la sustentabilidad y la regeneración de ecosistemas a través de la producción y comercialización de café, chocolate y miel. Colabora con comunidades indígenas y campesinas en estados como Chiapas, Oaxaca, Veracruz y Puebla, implementando prácticas agroecológicas que promueven la biodiversidad y la salud del suelo, como la agroforestería y el uso de bioinsumos locales.","ct":["servicio@buna.mx","(55) 3931 3846","https://buna.mx/"]},{"c":"sfe","n":"ESTADO NATURAL. SUCURSALES: CENTRO SANTA FE Y PATIO SANTA FE","cat":"Salud y bienestar","sub":["Alimentos para preparar en casa"],"cr":["Acopio de materiales","Tienda a granel","Reducción de plásticos"],"of":"Tienen productos de despensa: básicos, botanas, especias y condimentos, infusiones y tés, nueces y fruta deshidratada, untables y mieles. De cuidado personal ofrecen productos de higiene del cabello, higiene bucal e higiene corporal. Y del hogar tienen productos del cuidado del hogar, accesorios, recetarios y libros y regalos.","pq":"Estado Natural es una tienda a granel, es decir, sin marcas y sin empaques. Su misión es promover un estilo de vida saludable a través de productos naturales y reducir el desperdicio de alimentos y residuos sólidos. Además, ofrecen 5% de descuento si llevas tus propios recipientes.","ct":["yocompro@estadonatural.com.mx","(55) 9290-9258","https://estadonatural.com.mx/"]},{"c":"sfe","n":"SMART BAMBOO","cat":"Salud y bienestar","sub":["Mobiliario para vivienda"],"cr":["Materiales naturales","Calidad de vida"],"of":"Smart Bamboo tiene los siguientes productos relacionados al descanso: colchones Smart, base eléctrica, almohadas, sábanas, colchas, edredones, duvets, toallas y batas, pijamas, colchoneta, protector de colchón y sillones de masaje.","pq":"Smart Bamboo es una empresa que piensa en la importancia y calidad del descanso y en tener un desanso saludable y respetuoso con el medio ambiente. Sus productos están hechos a base de fibra de bamboo, una fibra ecológica, biodegradable y reciclable, a diferencia de los colchones comunes que pueden tardar hasta 500 años en degradarse.","ct":["contacto@smartbamboo.mx","52 55 8421 0318","https://www.smartbamboo.mx/"]},{"c":"sfe","n":"PUJOL","cat":"Salud y bienestar","sub":["Comida en restaurantes"],"cr":["Eficiencia energética","Uso responsable del agua","Innovación sostenible"],"of":"Comida mexicana de autor","pq":"Pujol es un restaurante que busca cumplir con la normatividad ambiental local, ahorro de agua, eficiencia energética, manejo de residuos y reducción de emisiones y utilizar insumos y materiales locales de proveedores con compromiso ambiental.","ct":["info@pujol.com.mx","55 5545 4111","https://pujol.com.mx/"]},{"c":"sfe","n":"UIIXOL","cat":"Salud y bienestar","sub":["Productos de higiene personal"],"cr":["Empaques reciclables","Ingredientes naturales","Ingredientes locales","Reducción de plásticos","Libre de crueldad"],"of":"Productos de cuidado personal: jabones naturales, crema corporal, exfoliantes, bombas de baño, sales de baño y productos para bebé","pq":"Uiixol es una empresa mexicana   var extra = it.cr.length - 3;
  return '<a class="entry" href="#' + it.campus.id + '.' + it.id + '"><strong>' + esc(it.n) + '</strong>' +
    '<span class="soft">' + (conCampus ? esc(it.campus.nombre + ', ' + it.cat) : esc(corta(it.of, 120))) + '</span>' +
    '<span class="tags">' + it.cr.slice(0, 3).map(function(c){ return '<span class="tag">' + esc(c) + '</span>'; }).join('') +
    (extra > 0 ? '<span class="tag">y ' + extra + ' más</span>' : '') + '</span></a>';
}

/* ===== Vistas ===== */
function vistaInicio(){
  var filas = CAMPUS.map(function(c){
    var linea = c.id === 'linea';
    return '<li' + (linea ? ' class="online"' : '') + '><a href="#' + c.id + '">' +
      '<span class="nm narrow">' + esc(c.nombre) + '</span><span class="dots"></span>' +
      '<span class="ct num">' + (c.items.length ? plural(c.items.length) : 'Próximamente') + '</span></a>' +
      (linea ? '<p class="soft">Iniciativas que aplican a todos los campus.</p>' : '') + '</li>';
  }).join('');
  app.innerHTML =
    '<div class="intro"><h1>Consumo consciente, futuro sostenible.</h1>' +
    '<p class="soft">' + DATA.length + ' productos y servicios sustentables para la comunidad del Tec. Elige tu campus para consultarlos por categoría y ver los criterios de sustentabilidad de cada uno.</p></div>' +
    '<ul class="index">' + filas + '</ul>';
}

function vistaCampus(c){
  if (!c.items.length) {
    app.innerHTML = '<div class="inner">' + pestanas(c.id) + '<div class="content"><h1 class="title narrow">' + esc(c.nombre) + '</h1>' +
      '<p class="none">Todavía no hay iniciativas en línea registradas. Cuando se agreguen a la base de datos aparecerán aquí, disponibles para todos los campus.</p>' +
      '<p><a class="hl" href="#inicio">Volver a los campus</a></p></div></div>';
    return;
  }
  var usadas = CATS.filter(function(k){ return c.items.some(function(it){ return it.cat === k; }); });
  app.innerHTML = '<div class="inner">' + pestanas(c.id) + '<div class="content">' +
    '<div class="headrow"><div><h1 class="title narrow">' + esc(c.nombre) + '</h1><p class="soft" id="conteo"></p></div>' +
      '<div class="find"><label for="buscar">Buscar en este campus</label>' +
      '<input id="buscar" type="search" placeholder="Nombre, producto o criterio" value="' + esc(estado.q) + '"></div></div>' +
    '<div class="filters" role="group" aria-label="Categoría">' + ['Todas'].concat(usadas).map(function(k){
      var n = k === 'Todas' ? c.items.length : c.items.filter(function(it){ return it.cat === k; }).length;
      return '<button type="button" data-cat="' + esc(k) + '" aria-pressed="' + (k === estado.cat) + '">' + esc(k) + ' <span class="num">(' + n + ')</span></button>';
    }).join('') + '</div><div id="lista" class="content"></div></div></div>';

  function pintar(){
    var q = norm(estado.q.trim());
    var lista = c.items.filter(function(it){
      return (estado.cat === 'Todas' || it.cat === estado.cat) &&
        (!q || norm([it.n, it.cat, it.sub.join(' '), it.cr.join(' '), it.of].join(' ')).indexOf(q) >= 0);
    });
    document.getElementById('conteo').textContent = lista.length === c.items.length
      ? plural(lista.length) : lista.length + ' de ' + plural(c.items.length);
    document.getElementById('lista').innerHTML = lista.length ? CATS.map(function(cat){
      var deCat = lista.filter(function(it){ return it.cat === cat; });
      if (!deCat.length) return '';
      var subs = [];
      deCat.forEach(function(it){ if (subs.indexOf(it.sub[0]) < 0) subs.push(it.sub[0]); });
      subs.sort(function(a, b){ return a.localeCompare(b, 'es'); });
      return '<section class="cat"><h2 class="narrow">' + esc(cat) + '<span class="num">' + deCat.length + '</span></h2>' +
        subs.map(function(s){
          return '<div class="sub"><h3>' + esc(s) + '</h3>' +
            deCat.filter(function(it){ return it.sub[0] === s; }).map(function(it){ return renglon(it); }).join('') + '</div>';
        }).join('') + '</section>';
    }).join('') : '<p class="none">Ninguna iniciativa de ' + esc(c.nombre) + ' coincide. Prueba con otra palabra o cambia de categoría.</p>';
  }
  document.getElementById('buscar').addEventListener('input', function(e){ estado.q = e.target.value; pintar(); });
  app.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click', function(){
      estado.cat = b.dataset.cat;
      app.querySelectorAll('.filters button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      pintar();
    });
  });
  pintar();
}

function contacto(x){
  if (/^(https?:\/\/|www\.)/i.test(x)) {
    var u = /^www\./i.test(x) ? 'https://' + x : x;
    return '<li><a class="hl" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(x.replace(/^https?:\/\/(www\.)?/i, '').replace(/[?#].*$/, '').replace(/\/$/, '')) + '</a></li>';
  }
  return '<li>' + esc(x) + '</li>';
}
function vistaFicha(c, it){
  var prev = c.items[it.id - 1], next = c.items[it.id + 1];
  app.innerHTML = '<div class="inner">' + pestanas(c.id) + '<div class="content">' +
    '<nav class="crumbs" aria-label="Ruta"><a class="hl" href="#' + c.id + '">' + esc(c.nombre) + '</a><span class="soft">/</span>' +
      '<span class="soft">' + esc(it.cat) + '</span><span class="soft">/</span><span class="soft">' + esc(it.sub.join(', ')) + '</span></nav>' +
    '<h1 class="title mid narrow">' + esc(it.n) + '</h1>' +
    '<div class="cols"><div class="content">' +
      '<section class="block"><h2 class="narrow">¿Qué ofrece?</h2><p>' + esc(it.of || 'Sin información en el directorio.') + '</p></section>' +
      '<section class="block"><h2 class="narrow">¿Por qué es sustentable?</h2><p>' + esc(it.pq || 'Sin información en el directorio.') + '</p></section>' +
      '<section class="block"><h2 class="narrow">Criterios de sustentabilidad</h2>' +
        '<p class="soft">Elige un criterio para ver qué otras iniciativas lo cumplen.</p>' +
        '<div class="tags">' + it.cr.map(function(k){
          var o = KMAP[k.toLowerCase()];
          return '<a class="tag" href="#k.' + o.id + '">' + esc(k) + ' <span class="num">(' + o.items.length + ')</span></a>';
        }).join('') + '</div></section>' +
    '</div>' +
    '<aside class="block aside"><h2 class="narrow">Contacto</h2>' +
      (it.ct.length ? '<ul class="contact">' + it.ct.map(contacto).join('') + '</ul>' : '<p class="soft">Sin datos de contacto en el directorio.</p>') +
      '<dl class="facts"><div><dt>Campus</dt><dd>' + esc(c.nombre) + '</dd></div>' +
      '<div><dt>Categoría</dt><dd>' + esc(it.cat) + '</dd></div>' +
      '<div><dt>Subcategoría</dt><dd>' + esc(it.sub.join(', ')) + '</dd></div></dl></aside></div>' +
    '<nav class="pager" aria-label="Otras iniciativas">' +
      (prev ? '<a class="hl" href="#' + c.id + '.' + prev.id + '">Anterior, ' + esc(prev.n) + '</a>' : '<span></span>') +
      (next ? '<a class="hl" href="#' + c.id + '.' + next.id + '">Siguiente, ' + esc(next.n) + '</a>' : '<span></span>') +
    '</nav></div></div>';
}

function vistaCriterios(){
  var max = KLIST[0].items.length;
  app.innerHTML = '<div class="content solo">' +
    '<div class="headrow"><div><h1 class="title mid narrow">Criterios de sustentabilidad</h1>' +
      '<p class="soft" id="kconteo"></p></div>' +
      '<div class="find"><label for="kbuscar">Buscar criterio</label>' +
      '<input id="kbuscar" type="search" placeholder="Por ejemplo, agua o residuos" value="' + esc(estado.kq) + '"></div></div>' +
    '<div id="klista"></div></div>';
  function pintar(){
    var q = norm(estado.kq.trim());
    var lista = KLIST.filter(function(k){ return !q || norm(k.nombre).indexOf(q) >= 0; });
    document.getElementById('kconteo').textContent = lista.length + ' criterios en ' + plural(DATA.length) + ', ordenados por cuántas los cumplen';
    document.getElementById('klista').innerHTML = lista.length ? lista.map(function(k){
      return '<a class="krow" href="#k.' + k.id + '"><b>' + esc(k.nombre) + '</b>' +
        '<span><span class="bar" style="display:block;width:' + Math.max(2, k.items.length / max * 100) + '%"></span></span>' +
        '<span class="n num">' + k.items.length + '</span></a>';
    }).join('') : '<p class="none">Ningún criterio coincide con esa búsqueda.</p>';
  }
  document.getElementById('kbuscar').addEventListener('input', function(e){ estado.kq = e.target.value; pintar(); });
  pintar();
}

function vistaCriterio(k){
  app.innerHTML = '<div class="content solo">' +
    '<nav class="crumbs" aria-label="Ruta"><a class="hl" href="#criterios">Criterios de sustentabilidad</a></nav>' +
    '<div><h1 class="title mid narrow">' + esc(k.nombre) + '</h1><p class="soft">' + plural(k.items.length) + ' con este criterio</p></div>' +
    CAMPUS.map(function(c){
      var l = k.items.filter(function(it){ return it.campus === c; });
      if (!l.length) return '';
      return '<section class="cat"><h2 class="narrow">' + esc(c.nombre) + '<span class="num">' + l.length + '</span></h2><div>' +
        l.map(function(it){ return renglon(it, true); }).join('') + '</div></section>';
    }).join('') + '</div>';
}

/* ===== Rutas (#inicio, #mty, #mty.2, #criterios, #k.5) ===== */
var ultimo = null;
function ruta(){
  var p = location.hash.replace('#', '').split('.');
  var c = campus(p[0]);
  if (p[0] === 'criterios') vistaCriterios();
  else if (p[0] === 'k' && KLIST[Number(p[1])]) vistaCriterio(KLIST[Number(p[1])]);
  else if (!c) vistaInicio();
  else {
    if (ultimo !== c.id) { estado.q = ''; estado.cat = 'Todas'; ultimo = c.id; }
    var it = p.length > 1 ? c.items[Number(p[1])] : null;
    if (it) vistaFicha(c, it); else vistaCampus(c);
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', ruta);
ruta();

/* ===== Figuras animadas del fondo ===== */
(function(){
  var cv = document.getElementById('fondo'), cx = cv.getContext('2d');
  var colores = ['#FFD84A','#7ED957','#0E7A3A','#B8F06A','#19B45A'];
  var tipos = ['circulo','cuadro','hoja','medio','aro'];
  var W = 0, H = 0, figs = [];
  var quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function medir(){
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  }
  function crear(i){
    return { x: Math.random() * W, y: Math.random() * H, r: (26 + Math.random() * 70) * (W < 700 ? .5 : 1),
      vx: (Math.random() - .5) * .7, vy: (Math.random() - .5) * .7,
      a: Math.random() * 6.28, va: (Math.random() - .5) * .012,
      t: tipos[i % tipos.length], c: colores[i % colores.length], o: (W < 700 ? .14 : .2) + Math.random() * .16 };
  }
  function dibujar(f){
    cx.save(); cx.translate(f.x, f.y); cx.rotate(f.a); cx.globalAlpha = f.o;
    cx.fillStyle = f.c; cx.strokeStyle = f.c; cx.lineWidth = f.r * .22; cx.beginPath();
    if (f.t === 'circulo') { cx.arc(0, 0, f.r, 0, 6.2832); cx.fill(); }
    else if (f.t === 'cuadro') { cx.fillRect(-f.r, -f.r, f.r * 2, f.r * 2); }
    else if (f.t === 'medio') { cx.arc(0, 0, f.r, 0, 3.1416); cx.fill(); }
    else if (f.t === 'aro') { cx.arc(0, 0, f.r, 0, 6.2832); cx.stroke(); }
    else { cx.moveTo(0, -f.r * 1.3); cx.quadraticCurveTo(f.r, 0, 0, f.r * 1.3); cx.quadraticCurveTo(-f.r, 0, 0, -f.r * 1.3); cx.fill(); }
    cx.restore();
  }
  function cuadro(){
    cx.clearRect(0, 0, W, H);
    figs.forEach(function(f){
      if (!quieto) {
        f.x += f.vx; f.y += f.vy; f.a += f.va;
        var m = f.r * 1.5;
        if (f.x < -m) f.x = W + m; if (f.x > W + m) f.x = -m;
        if (f.y < -m) f.y = H + m; if (f.y > H + m) f.y = -m;
      }
      dibujar(f);
    });
    if (!quieto) requestAnimationFrame(cuadro);
  }
  medir();
  for (var i = 0; i < (W < 700 ? 10 : 18); i++) figs.push(crear(i));
  window.addEventListener('resize', function(){ medir(); if (quieto) cuadro(); });
  cuadro();
})();
</script>
